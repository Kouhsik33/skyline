server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API on the same origin as the SPA: the SameSite=Lax session cookie is first-party.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
  }

  # Hashed bundles never change.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /manage/<club>/finance, /checkout/<payment> etc. load index.html on refresh.
  # index.html itself is never cached, so a new deploy and Back after logout fetch it fresh.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
