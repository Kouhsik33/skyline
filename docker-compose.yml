# Student Organization Management System — dev stack (LLD §1.1).
name: soms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soms
      POSTGRES_PASSWORD: soms
      POSTGRES_DB: soms
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soms -d soms && psql -U soms -d soms_test -c 'select 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgres://soms:soms@db:5432/soms
      TEST_DATABASE_URL: postgres://soms:soms@db:5432/soms_test
      # Dev only: the entrypoint runs the idempotent demo seed after migrating (docs/DEMO_ACCOUNTS.md).
      SEED_ON_START: ${SEED_ON_START:-true}
      LLD_PATH: /docs/LLD.md
      UPLOAD_DIR: /app/uploads
      # Behind the frontend nginx (one hop). Cookie Secure stays off: local stack is plain HTTP.
      TRUST_PROXY: 1
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - uploads:/app/uploads
      - ./docs:/docs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health | grep -q '\"db\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Production build of the SPA (nginx). Same origin for /api, deep-link fallback (B6).
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"root\">' && wget -qO- http://127.0.0.1/api/v1/health | grep -q '\"db\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  uploads:
  backend_node_modules:
